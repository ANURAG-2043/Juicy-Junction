<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juicy Junction - Cart</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: white;
            font-family: 'Arial', sans-serif;
        }
        
        .header {
            text-align: center;
            padding: 40px 0;
            background: #f8f8f8;
        }

        .header h1 {
            color: #333;
            margin: 0;
        }

        .content {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .back-button:hover {
            background: #555;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .cart-item {
            display: flex;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            padding: 20px;
            align-items: center;
        }

        .item-name {
            flex: 1;
            font-size: 18px;
            color: #333;
        }

        .item-quantity {
            margin: 0 20px;
            font-weight: bold;
        }

        .item-price {
            margin: 0 20px;
            color: #666;
        }

        .remove-btn {
            padding: 5px 10px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .cart-total {
            margin-top: 30px;
            text-align: right;
            font-size: 20px;
            font-weight: bold;
        }

        .empty-cart {
            text-align: center;
            color: #666;
            padding: 50px;
            font-size: 18px;
        }

        .place-order-btn {
            display: block;
            width: 200px;
            margin: 30px 0 50px auto;
            padding: 15px 30px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
            z-index: 1000; /* Add z-index to ensure button stays on top */
            position: relative; /* Add position relative */
            box-shadow: 0 4px 8px rgba(0,0,0,0.2); /* Add shadow for better visibility */
        }

        .place-order-btn:hover {
            background: #45a049;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3); /* Enhanced shadow on hover */
            transform: translateY(-2px); /* Slight lift effect on hover */
        }

        .orders-popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .orders-popup-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: left;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .orders-popup-content .close-orders-popup {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #333;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .orders-popup-content .close-orders-popup:hover {
            background: #555;
        }

        .order-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
            margin-bottom: 15px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .order-status {
            padding: 5px 10px;
            border-radius: 5px;
            background: #4CAF50;
            color: white;
        }

        .order-details {
            color: #666;
            font-size: 14px;
        }

        .close-orders-popup {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #333;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .close-orders-popup:hover {
            background: #555;
        }

        .order-number {
            font-size: 48px;
            color: #333;
            margin: 20px 0;
            font-weight: bold;
        }

        .order-total {
            font-size: 24px;
            color: #666;
            margin: 20px 0;
        }

        .close-popup {
            display: inline-block;
            padding: 10px 30px;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .close-popup:hover {
            background: #555;
        }
        .my-orders-button {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 10px 20px;
        background: #4CAF50;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        transition: background 0.3s;
        font-weight: bold;
    }

    .my-orders-button:hover {
        background: #45a049;
    }
    </style>
</head>
<body>
    <a href="javascript:void(0)" class="back-button" onclick="goBack()">← Back</a>
    <a href="javascript:void(0)" class="my-orders-button" onclick="showOrders()">My Orders</a>
    
    <div class="header">
        <h1>Your Cart</h1>
    </div>

    <div class="content">
        <div id="cart-items" class="cart-items">
            <!-- Cart items will be dynamically added here -->
        </div>
        <div class="cart-total">
            Total: Rs.<span id="total-amount">0.00</span>
        </div>
        <button class="place-order-btn" onclick="placeOrder()">Place Order</button>
    </div>

    <!-- Orders Popup -->
    <div class="orders-popup-overlay" id="ordersPopup">
        <div class="orders-popup-content">
            <h2>My Orders</h2>
            <button class="close-orders-popup" onclick="closeOrdersPopup()">×</button>
            <div id="ordersList">
                <!-- Orders will be dynamically added here -->
            </div>
        </div>
    </div>

    <script>
        // Store order number in localStorage to maintain sequence
        let currentOrderNumber = parseInt(localStorage.getItem('lastOrderNumber')) || 0;

        function displayCart() {
            const cartItems = JSON.parse(localStorage.getItem('cart')) || [];
            const cartContainer = document.getElementById('cart-items');
            const totalAmount = document.getElementById('total-amount');
            let total = 0;

            if (cartItems.length === 0) {
                cartContainer.innerHTML = '<div class="empty-cart">Your cart is empty</div>';
                return;
            }

            cartContainer.innerHTML = cartItems.map((item, index) => {
                const itemTotal = item.quantity * 50; // Changed from 5 to 50
                total += itemTotal;
                return `
                    <div class="cart-item">
                        <span class="item-name">${item.name}</span>
                        <span class="item-quantity">x${item.quantity}</span>
                        <span class="item-price">Rs. ${itemTotal.toFixed(2)}</span>
                        <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
                    </div>
                `;
            }).join('');

            totalAmount.textContent = total.toFixed(2);
        }

        function removeItem(index) {
            const cartItems = JSON.parse(localStorage.getItem('cart')) || [];
            cartItems.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cartItems));
            displayCart();
        }

        function placeOrder() {
            const total = parseFloat(document.getElementById('total-amount').textContent);
            if (total === 0) {
                alert('Your cart is empty!');
                return;
            }

            currentOrderNumber++;
            localStorage.setItem('lastOrderNumber', currentOrderNumber);
            
            const cartItems = JSON.parse(localStorage.getItem('cart')) || [];
            const newOrder = {
                orderNumber: currentOrderNumber,
                items: cartItems,
                total: total,
                timestamp: new Date().getTime(),
                status: 'in-progress'
            };
        
            const existingOrders = JSON.parse(localStorage.getItem('orders')) || [];
            existingOrders.push(newOrder);
            localStorage.setItem('orders', JSON.stringify(existingOrders));
            
            // Show order confirmation popup
            const ordersList = document.getElementById('ordersList');
            ordersList.innerHTML = `
                <div class="order-item">
                    <div class="order-header">
                        <span class="order-number" style="font-size: 48px; color: #333; margin: 20px 0; font-weight: bold;">#${newOrder.orderNumber}</span>
                        <span class="order-status">${newOrder.status}</span>
                    </div>
                    <div class="order-details">
                        ${newOrder.items.map(item => `
                            <p>${item.name} x${item.quantity}</p>
                        `).join('')}
                        <p style="font-size: 24px; color: #666; margin: 20px 0;">Total: Rs. ${newOrder.total.toFixed(2)}</p>
                        <p>Ordered: ${new Date(newOrder.timestamp).toLocaleString()}</p>
                    </div>
                </div>
            `;
            
            document.getElementById('ordersPopup').style.display = 'flex';
            
            // Clear cart after order
            localStorage.setItem('cart', '[]');
            displayCart();
        }

        // Remove closePopup function as it's no longer needed

        function showOrders() {
            const orders = JSON.parse(localStorage.getItem('orders')) || [];
            const ordersList = document.getElementById('ordersList');
            
            // Sort orders by timestamp in descending order (most recent first)
            const sortedOrders = orders.sort((a, b) => b.timestamp - a.timestamp);
            
            if (sortedOrders.length === 0) {
                ordersList.innerHTML = '<p>No orders found.</p>';
            } else {
                ordersList.innerHTML = sortedOrders.map(order => `
                    <div class="order-item">
                        <div class="order-header">
                            <span class="order-number">#${order.orderNumber}</span>
                            <span class="order-status">${order.status}</span>
                        </div>
                        <div class="order-details">
                            ${order.items.map(item => `
                                <p>${item.name} x${item.quantity}</p>
                            `).join('')}
                            <p>Total: Rs. ${order.total.toFixed(2)}</p>
                            <p>Ordered: ${new Date(order.timestamp).toLocaleString()}</p>
                        </div>
                    </div>
                `).join('');
            }
            
            document.getElementById('ordersPopup').style.display = 'flex';
        }

        function closeOrdersPopup() {
            document.getElementById('ordersPopup').style.display = 'none';
            // Reset cart display
            document.getElementById('total-amount').textContent = '0.00';
            document.getElementById('cart-items').innerHTML = '<div class="empty-cart">Your cart is empty</div>';
        }

        // Reset the display after closing popup
        document.getElementById('total-amount').textContent = '0.00';
        document.getElementById('cart-items').innerHTML = '<div class="empty-cart">Your cart is empty</div>';

        // Display cart items when page loads
        displayCart();

        // Add the goBack function
        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
